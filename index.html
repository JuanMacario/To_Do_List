<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-vh-100 h-auto justify-content-center">
    <div class="container align-items-center justify-content-center vh-100 align-content-center">
        <div class="card p-5 align-items-center h-auto carta">
            <h2>To Do List</h2> <br>

            <div class="d-flex mb-5">
                <input id="inputTarea" type="text" class="form-control" placeholder="Escribe una tarea">
                <button id="btnTarea" class="btn btn-danger w-50 ms-3">Crear Tareas</button>
            </div>

            <div id="tareas" class="w-100 d-flex flex-column align-items-center gap-2">

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="index.js"></script>
</body>

</html>
